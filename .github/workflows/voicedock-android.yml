name: VoiceDock Android

on:
  push:
    branches: [main, arena/fa6b6228-fazle-core]
    paths:
      - "voicedock-android/**"
      - ".github/workflows/voicedock-android.yml"
  pull_request:
    paths:
      - "voicedock-android/**"
      - ".github/workflows/voicedock-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voicedock-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voicedock-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests, lint, and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voicedock-android-verification
          if-no-files-found: warn
          path: |
            voicedock-android/app/build/reports/
            voicedock-android/app/build/outputs/apk/debug/*.apk
